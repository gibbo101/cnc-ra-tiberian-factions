; ******* Tiberian Factions mod weapons (TD ports) *******

; TD Advanced Guard Tower Missile — fires the BULLET_SSM ("DRAGON") homing
; missile in salvos of 2 (TD ClassATower.IsTwoShooter=true). Dual-role
; (air & ground) like TD's original.
; Source: tiberiandawn/const.cpp WEAPON_TOW_TWO
;   {BULLET_SSM, 60, 40, 0x0680, VOC_ROCKET2, ANIM_NONE}
; Burst=2 implements TD's IsTwoShooter on ClassATower — TD has it as a
; building-class flag; RA derives Is_Two_Shooter() from PrimaryWeapon->Burst>1
; (techno.cpp:7155-7161). Same Fire_At toggle/delay mechanic, RA idiom.
; Warhead=TDHE (not RA's vanilla [HE]) per docs/td-atwr-deep-dive.md M5.
[TDTowTwo]
Damage=60
ROF=40
Range=6.5
Projectile=TDSSM
; Speed=60 is TD's raw MPH_ROCKET (tiberiandawn/defines.h:627). TDTowTwo is
; flagged IsTDPort=true in rules.cpp so WeaponTypeClass::Read_INI parses this
; as raw MPHType instead of RA's 0-100 percentage. Direct TD-source value.
; See [[reference-ra-mphtype-ini-format]] / [[project-td-port-architecture]].
Speed=60
Warhead=TDAGT      ; Dedicated AGT warhead (a TDHE clone, kept for independent tuning). F8 had raised its vs-heavy 25->50, reverted to 25 -- the AGT is already strong (Burst=2, anti-air, cheap/low-power), so no stacked anti-tank buff. See balance-deep-dive.md.
Report=ROCKET2
Anim=GUNFIRE
Burst=2

; TD Nod Turret cannon — TD-authentic ROF/range, fully separated from RA's
; [TurretGun] so vanilla Allied Turret balance is unchanged.
; Source: tiberiandawn/const.cpp WEAPON_TURRET_GUN
;   {BULLET_APDS, 40, 60, 0x0600, VOC_TANK4, ANIM_MUZZLE_FLASH}
; Fires [TDAPDS] (TD-prefixed, decoupled from RA's [Cannon] balance pool).
; Speed=40 verified against MPH_VERY_FAST (RA [90mm]/[TurretGun] match).
; See docs/td-gtwr-gun-verification.md.
[TDTurretGun]
Damage=40
ROF=50            ; v4.0 balance: was 60 (TD-authentic). Allied [TurretGun] parity (50). At TL10 "earlier" is no offset, so the Nod Turret was 600cr for a strictly inferior defence (ROF was the only gap; HP already equal -- 200*2=400 runtime). See balance-deep-dive.md.
Range=6
Projectile=TDAPDS
Speed=40
Warhead=TDAP        ; TD WARHEAD_AP (BULLET_APDS) -- was RA-vanilla AP leak
Report=TNKFIRE6
Anim=GUNFIRE

