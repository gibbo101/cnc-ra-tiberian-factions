Recruitable=no
Retaliate=no
Rate=.1

; Sit Around And Engage Any Enemy That Wanders Within Weapon Range
[Guard]
Rate=.050
AARate=.016

; Enter Building Or Transport For Loading Purposes
[Enter]
Retaliate=no
Recruitable=no
